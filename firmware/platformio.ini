; Two firmwares share the ML-KEM sources:
;   pio run -e bench  -t upload   -> 100-run on-device benchmark (Phase 2)
;   pio run -e server -t upload   -> WiFi ML-KEM handshake server (Phase 3)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5

[env:bench]
build_src_filter = +<*> -<server.cpp>

[env:server]
build_src_filter = +<*> -<bench.cpp>
